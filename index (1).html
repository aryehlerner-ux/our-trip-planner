<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Family Trip Planner</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#16233E" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="ambient-bg" aria-hidden="true">
  <div class="ambient-blob blob-a"></div>
  <div class="ambient-blob blob-b"></div>
  <div class="ambient-blob blob-c"></div>
</div>

<header class="topbar">
  <div class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12.5 3.5 20 8l-3.3 2-4.2-2.3-4.2 2.3L5 8l7.5-4.5Z" fill="currentColor"/>
      <path d="M8.5 10.3 4.5 12.4l1.6 6.1 3.4-1.9" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15.5 10.3 19.5 12.4l-1.6 6.1-3.4-1.9" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="brand">Family Trip Planner<small>Stage 15 — Redesigned, Liquid Glass</small></div>
  <div class="version-badge" id="version-badge"></div>
</header>

<main id="main"></main>

<div class="toast" id="toast"></div>

<nav class="bottom-nav">
  <div class="nav-indicator" id="nav-indicator" aria-hidden="true"></div>
  <button data-view="dashboard" class="active">
    <span class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3.5 11.5 12 4.2l8.5 7.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5.5 10v8.3a1 1 0 0 0 1 1H9.7v-5.6h4.6v5.6h3.2a1 1 0 0 0 1-1V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>Dashboard</span>
  </button>
  <button data-view="route">
    <span class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21s6.5-6.7 6.5-11.2A6.5 6.5 0 0 0 5.5 9.8C5.5 14.3 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="12" cy="9.6" r="2.3" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </span>
    <span>Route</span>
  </button>
  <button data-view="budget">
    <span class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3.2" y="6.2" width="17.6" height="12.6" rx="2.6" stroke="currentColor" stroke-width="1.8"/>
        <path d="M3.2 10.2h17.6" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="16.3" cy="14.3" r="1.3" fill="currentColor"/>
      </svg>
    </span>
    <span>Budget</span>
  </button>
  <button data-view="settings">
    <span class="glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="4" y1="7" x2="20" y2="7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="9.5" cy="7" r="2.1" fill="var(--nav-glyph-bg,#fff)" stroke="currentColor" stroke-width="1.8"/>
        <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="15" cy="12" r="2.1" fill="var(--nav-glyph-bg,#fff)" stroke="currentColor" stroke-width="1.8"/>
        <line x1="4" y1="17" x2="20" y2="17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="7.5" cy="17" r="2.1" fill="var(--nav-glyph-bg,#fff)" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </span>
    <span>Settings</span>
  </button>
</nav>

<script src="./country-data.js"></script>
<script src="./hebcal-bundle.js"></script>
<script src="./app.js"></script>
</body>
</html>
